<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eveland — Minecraft Server</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #111820;
        }

        header h2 {
            margin: 0;
            color: #4ade80;
        }

        .hero {
            min-height: 80vh;
            padding: 100px 20px;
            background: linear-gradient(#0008, #000b),
                        url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1600&q=80")
                        center/cover;
        }

        .hero h1 {
            font-size: 60px;
            margin: 20px 0;
            color: #4ade80;
        }

        .hero p {
            font-size: 20px;
            color: #ddd;
        }

        .ip {
            display: inline-block;
            margin: 30px 0;
            padding: 15px 20px;
            background: #141c25;
            border-radius: 10px;
            font-size: 18px;
        }

        button {
            border: 0;
            padding: 14px 25px;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .cards {
            padding: 50px 20px;
        }

        .cards h2 {
            font-size: 32px;
        }

        .card {
            display: inline-block;
            width: 220px;
            margin: 10px;
            padding: 25px;
            background: #141c25;
            border-radius: 12px;
        }

        .card h3 {
            color: #4ade80;
        }

        footer {
            padding: 25px;
            background: #080b0f;
            color: #888;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 42px;
            }

            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>EVELAND</h2>
</header>

<section class="hero">
    <h1>EVELAND</h1>

    <p>Minecraft сервер с режимом выживания</p>

    <div class="ip">
        185.9.145.83:25666
        <br><br>
        <button onclick="copyIP()">Скопировать IP</button>
    </div>

    <br>

    <button>НАЧАТЬ ИГРАТЬ</button>
</section>

<section class="cards">

    <h2>О сервере</h2>

    <div class="card">
        <h3>⚔️ Выживание</h3>
        <p>Классическое выживание в Minecraft</p>
    </div>

    <div class="card">
        <h3>🌎 Без вайпов</h3>
        <p>Мир сервера сохраняется</p>
    </div>

    <div class="card">
        <h3>🎮 Версия</h3>
        <p>1.21.1</p>
    </div>

</section>

<footer>
    © 2026 Eveland
</footer>

<script>
function copyIP() {
    navigator.clipboard.writeText("185.9.145.83:25666");
    alert("IP скопирован!");
}
</script>

</body>
</html>
